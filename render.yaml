# Render Blueprint: staging deploys from `develop`, production from `main`.
# Both run on Render's free plan; the database is Neon (see README).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: groundwork-api-staging
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    autoDeployTrigger: checksPass
    dockerCommand: ./bin/render-start
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false # remove after the first admin can log in
      - key: WEB_CONCURRENCY
        value: "0" # single Puma process; the free plan has 512 MB RAM
      - key: SEED_SAMPLE_DATA
        value: "true" # fictional sample research; never set this on production

  - type: web
    name: groundwork-api-production
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerCommand: ./bin/render-start
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false # remove after the first admin can log in
      - key: WEB_CONCURRENCY
        value: "0" # single Puma process; the free plan has 512 MB RAM
