name: Claude review

# Claude Code reviews pull requests using the owner's Claude subscription
# (secret CLAUDE_CODE_OAUTH_TOKEN, created with `claude setup-token`).
# - A review runs when a PR is opened, reopened or marked ready for review.
# - Comment "@claude <request>" on a PR to ask for a re-review or a question.
# Only the repository owner can trigger Claude: the repo is public, and every
# run uses the owner's subscription.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: >
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first: it defines this project's conventions,
            workflow and the product rules the code must follow.

            Focus on, in order:
            1. Bugs and incorrect behaviour.
            2. Security problems and leaked secrets (the repository is public).
            3. Breaks of the product rules in AGENTS.md (sources and dates on claims, explicit
               "unconfirmed"/"not public", reasons with every fit verdict, privacy, data deletion).
            4. Breaks of the coding conventions in AGENTS.md, and missing tests.

            Only report real problems, each with a concrete suggestion. Skip pure style nits that
            the linters already check. Leave inline comments on specific lines, then one short
            summary comment with an overall verdict. If you find nothing worth changing, say so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  respond:
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Respond with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
