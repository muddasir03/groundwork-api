name: Claude

# On-demand Claude Code help on pull requests, using the owner's Claude
# subscription (secret CLAUDE_CODE_OAUTH_TOKEN, created with `claude setup-token`).
# Comment "@claude review this PR" (or any question) on a PR. Nothing runs
# automatically. Only the repository owner can trigger Claude: the repo is
# public, and every run uses the owner's subscription. Claude follows AGENTS.md
# (loaded through CLAUDE.md).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  respond:
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Respond with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
